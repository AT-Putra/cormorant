# Plain Compose Spec — runs identically via `podman compose` (dev, rootless)
# and `docker compose up` (prod). No engine-specific extensions.
#
# NAMED VOLUMES ONLY: Docker/Podman copy-on-first-use initializes named volumes
# from image content, carrying the seeded /config/venv into fresh volumes.
# A host-bind on /config would HIDE the seeded venv and break non-root writes
# (Decision C in .omc/plans/video-downloader-plan.md) — do not switch to binds.

services:
  app:
    # `image` and `build` together, deliberately. The server runs published
    # images (`docker compose pull` -> `up -d`, ~20s, no toolchain on the host);
    # this laptop still builds from source with `podman compose up --build`,
    # which writes to this same tag locally without touching the registry.
    # TAG floats to :latest; set it to a git sha to pin or roll back.
    image: ghcr.io/at-putra/cormorant:${TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cormorant
    restart: unless-stopped   # also the vehicle for post-yt-dlp-update restarts
    ports:
      - "8000:8000"
    volumes:
      - vd_config:/config
      - vd_data:/data
      - vd_media:/media
    environment:
      - TZ=${TZ:-UTC}         # quiet-hours correctness

volumes:
  vd_config:
  vd_data:
  vd_media:
